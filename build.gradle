import edu.wpi.first.toolchain.*

plugins {
    id 'cpp'
    id 'google-test'
    id 'edu.wpi.first.wpilib.repositories.WPILibRepositoriesPlugin' version '2025.0'
    id 'edu.wpi.first.NativeUtils' version '2026.0.1'
    id 'edu.wpi.first.GradleVsCode' version '2.1.0'
}

// Only used by native-utils' dependency configuration. This library does not
// link against WPILib - see the component below.
ext.wpilibVersion = "2026.+"

repositories {
    mavenCentral()
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}

apply from: 'config.gradle'

nativeUtils {
    exportsConfigs {
        // Empty config exports everything.
        HighVoltageLuaLib {
        }
    }
}

model {
    components {
        HighVoltageLuaLib(NativeLibrarySpec) {
            sources {
                cpp {
                    source {
                        srcDirs 'src/main/native/cpp', 'third_party/lua/src'
                        include '**/*.cpp', '**/*.c'
                        // lua.c and luac.c both define main() - they are the
                        // standalone interpreter and compiler, not library code.
                        exclude '**/lua.c', '**/luac.c'
                    }
                    exportedHeaders {
                        srcDirs 'src/main/native/include',
                                'third_party/lua/src',
                                'third_party/LuaBridge3'
                    }
                }
            }
            // NOTE: Lua's .c files are deliberately in the *cpp* source set, so
            // g++ compiles them as C++ rather than C. This is not a tidiness
            // choice - it is required. Lua's headers have no extern "C" guards
            // (that is what lua.hpp is for), and this library's public headers
            // include "lua.h" directly. Compiling Lua as C would give its
            // symbols C linkage while every C++ call site expects C++ linkage,
            // and the link fails with hundreds of undefined references.
            //
            // It also matches how FRC231_2026 built Lua before the split, so
            // behaviour is unchanged. Note that Lua-as-C++ uses exceptions
            // rather than longjmp for error handling, which is the safer of
            // the two when C++ destructors are on the stack.
            // Deliberately no nativeUtils.useRequiredLibrary(it, 'wpilib_shared').
            // This library depends on nothing but Lua, LuaBridge3 and the STL.
        }
    }
    testSuites {
        // The google-test plugin creates <Component>Test automatically.
        HighVoltageLuaLibTest {
            sources.cpp {
                source {
                    srcDir 'src/test/native/cpp'
                    include '**/*.cpp'
                }
            }
            nativeUtils.useRequiredLibrary(it, 'googletest_static')
        }
    }
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion = '8.14.3'
}
